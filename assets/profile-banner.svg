<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Felipe Vilela Freire profile banner</title>
  <desc id="desc">Dark product-focused banner for a full-stack developer profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.48" stop-color="#0E172A"/>
      <stop offset="1" stop-color="#102A43"/>
    </linearGradient>
    <linearGradient id="line" x1="130" y1="70" x2="1040" y2="285" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.2 0 0 0 0 0.75 0 0 0 0 0.95 0 0 0 0.22 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <path d="M80 258C217 111 331 303 489 177C650 49 781 233 943 129C1020 80 1074 68 1125 69" stroke="url(#line)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M0 310C122 284 211 302 335 285C505 262 587 307 771 270C953 233 1055 254 1200 220V360H0V310Z" fill="#0F172A" fill-opacity="0.76"/>
  <g opacity="0.7">
    <rect x="77" y="70" width="142" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="236" y="70" width="110" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="362" y="70" width="180" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08"/>
  </g>
  <text x="78" y="158" fill="#E5F0FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="0">Felipe Vilela Freire</text>
  <text x="82" y="205" fill="#A8C7DD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="500">Full-stack developer building SaaS products, operational systems and AI-assisted workflows.</text>
  <text x="82" y="267" fill="#D7E7F3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">React • Next.js • TypeScript • Django • Python • APIs • Product Architecture</text>
  <g transform="translate(930 100)">
    <rect width="190" height="138" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="24" y="29" width="142" height="14" rx="7" fill="#38BDF8"/>
    <rect x="24" y="59" width="96" height="14" rx="7" fill="#22C55E"/>
    <rect x="24" y="89" width="124" height="14" rx="7" fill="#F59E0B"/>
  </g>
</svg>
