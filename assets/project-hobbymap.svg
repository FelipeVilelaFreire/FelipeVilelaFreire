    <rect x="256" width="92" height="30" rx="15" fill="#F59E0B" fill-opacity="0.18"/>
    <text x="279" y="20" fill="#FCD34D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Finance</text>
  </g>
  <circle cx="477" cy="118" r="66" fill="#22C55E" fill-opacity="0.13"/>
  <path d="M477 67L522 144H432L477 67Z" stroke="#86EFAC" stroke-width="7" stroke-linejoin="round"/>
