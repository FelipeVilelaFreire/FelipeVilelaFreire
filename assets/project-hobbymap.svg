<svg width="620" height="250" viewBox="0 0 620 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HobbyMap project card</title>
  <desc id="desc">Visual card for HobbyMap, a provider operations and scheduling product.</desc>
  <rect width="620" height="250" rx="22" fill="#101615"/>
  <rect x="28" y="28" width="564" height="194" rx="18" fill="#16221F" stroke="#2B463D"/>
  <text x="54" y="76" fill="#ECFDF5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">HobbyMap</text>
  <text x="54" y="110" fill="#ABC4BA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Classes, instructors, students, scheduling and provider operations.</text>
  <g transform="translate(54 139)">
    <rect width="112" height="30" rx="15" fill="#22C55E" fill-opacity="0.18"/>
