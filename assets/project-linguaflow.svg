<svg width="620" height="250" viewBox="0 0 620 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LinguaFlow project card</title>
  <desc id="desc">Visual card for LinguaFlow, a language learning product.</desc>
  <rect width="620" height="250" rx="22" fill="#151023"/>
  <rect x="28" y="28" width="564" height="194" rx="18" fill="#1F1933" stroke="#3A3157"/>
