<svg width="620" height="250" viewBox="0 0 620 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MeuCV project card</title>
  <desc id="desc">Visual card for MeuCV, a CV platform with editor and admin panel.</desc>
  <rect width="620" height="250" rx="22" fill="#171717"/>
  <rect x="28" y="28" width="564" height="194" rx="18" fill="#242424" stroke="#3D3D3D"/>
  <text x="54" y="76" fill="#FAFAFA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">MeuCV</text>
  <text x="54" y="110" fill="#C8C8C8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Public resume pages, authenticated editor and admin platform.</text>
  <g transform="translate(54 139)">
    <rect width="86" height="30" rx="15" fill="#38BDF8" fill-opacity="0.17"/>
    <text x="21" y="20" fill="#7DD3FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Next.js</text>
    <rect x="100" width="92" height="30" rx="15" fill="#22C55E" fill-opacity="0.17"/>
    <text x="123" y="20" fill="#86EFAC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Django</text>
    <rect x="206" width="104" height="30" rx="15" fill="#F59E0B" fill-opacity="0.17"/>
    <text x="228" y="20" fill="#FCD34D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Admin</text>
  </g>
  <rect x="439" y="60" width="98" height="132" rx="14" fill="#FAFAFA" fill-opacity="0.08" stroke="#FAFAFA" stroke-opacity="0.18"/>
  <circle cx="488" cy="95" r="18" fill="#38BDF8" fill-opacity="0.7"/>
  <rect x="462" y="126" width="52" height="8" rx="4" fill="#FAFAFA" fill-opacity="0.5"/>
  <rect x="458" y="146" width="60" height="8" rx="4" fill="#FAFAFA" fill-opacity="0.3"/>
</svg>
